server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Required so that proxy_pass with a variable
    # resolves "api" per-request instead of once at worker startup (which fails
    # with "host not found in upstream" if the api container isn't ready yet).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Proxy API requests to the backend.
    #
    # IMPORTANT: proxy_pass must NOT include a path component when using a
    # variable. With a literal URL, nginx strips the location prefix before
    # appending the proxy_pass path. With a variable it does NOT — so
    # `proxy_pass $backend/api/` would produce double /api/ in the upstream
    # URI and give 404s for every request.
    #
    # Using `proxy_pass $backend` (no trailing path) passes the full original
    # URI — e.g. /api/auth/login — directly to the backend, which registers
    # all routes under /api/ and therefore receives the correct path.
    location /api/ {
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
